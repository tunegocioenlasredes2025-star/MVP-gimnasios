<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CuotaClub — Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Cuota<span>Club</span></div>
      <div class="gym-name" data-gym-name>…</div>
      <nav>
        <a href="/dashboard.html" class="active" data-icon="dashboard"><span>Dashboard</span></a>
        <a href="/socios.html" data-icon="users"><span>Socios</span></a>
        <a href="/socios.html?filtro=moroso" data-icon="alert"><span>Deudores</span></a>
        <a href="/config.html" data-icon="settings"><span>Configuración</span></a>
      </nav>
      <div class="spacer"></div>
      <button class="logout" data-icon="logout" onclick="logout()"><span>Salir</span></button>
    </aside>

    <main class="main">
      <div class="page-head">
        <div>
          <h1>Dashboard</h1>
          <div class="sub">Resumen de tu cobranza · <span data-gym-name>…</span></div>
        </div>
        <div class="head-actions">
          <a class="btn" href="/socios.html?filtro=moroso" data-icon="wallet" data-icon-size="16"><span>Gestionar deudores</span></a>
        </div>
      </div>

      <div class="kpi-grid" id="kpis"></div>

      <div class="card">
        <div class="card-head"><h3>Accesos rápidos</h3></div>
        <div class="card-pad" style="display:flex; gap:10px; flex-wrap:wrap;">
          <a class="btn secondary" href="/socios.html?filtro=por_vencer" data-icon="calendar" data-icon-size="16"><span>Por vencer</span></a>
          <a class="btn secondary" href="/socios.html?filtro=moroso" data-icon="alert" data-icon-size="16"><span>Deudores</span></a>
          <a class="btn secondary" href="/socios.html" data-icon="users" data-icon-size="16"><span>Socios</span></a>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
